name: ticketinsight-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --constraint requirements.lock torch==2.13.0+cpu
      - run: python -m pip install --constraint requirements.lock -e ".[dev,p1,p1-model,p2,p3,p3-model]"
      - run: python -m compileall -q app alembic scripts tests
      - run: python -m pytest -q
      - run: python -m pip check
