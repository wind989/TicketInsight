name: Publish initial release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-initial-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.1.0 if absent
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view v0.1.0 --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 already exists."
            exit 0
          fi
          gh release create v0.1.0 \
            --repo "$REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "v0.1.0 初始版本" \
            --notes "这是 TicketInsight 的第一个公开版本，发布当前可用的客服工单分析平台骨架与项目说明。"
